name: Checks

on:
  pull_request:
  push:
    branches: [main, 'phase-*', demo-maintainability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Credential-free quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARRIER_RISK_TEST_DATABASE_URL: host=localhost port=5432 dbname=carrier_risk_raw_test user=carrier_risk
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,airflow]'

      - name: Check Python style and types
        run: |
          ruff check .
          ruff format --check .
          mypy ingest orchestration

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Cache locked Terraform providers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/terraform-plugins
          key: terraform-${{ runner.os }}-${{ runner.arch }}-1.16.0-${{ hashFiles('infra/**/.terraform.lock.hcl') }}

      - name: Start isolated PostgreSQL
        run: |
          password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$password"
          printf 'PGPASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          export POSTGRES_PASSWORD="$password"
          docker run --detach --name carrier-risk-test-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD \
            --env POSTGRES_USER=carrier_risk \
            --env POSTGRES_DB=carrier_risk_raw_test \
            --health-cmd='pg_isready -U carrier_risk -d carrier_risk_raw_test' \
            --health-interval=2s --health-timeout=5s --health-retries=30 \
            postgres:17
          for _ in {1..60}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' carrier-risk-test-postgres)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs carrier-risk-test-postgres
          exit 1

      - name: Run full PostgreSQL and offline contract suite
        id: tests
        run: |
          for variable in ${!AWS_@}; do
            unset "$variable"
          done
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_CONFIG_FILE="$RUNNER_TEMP/no-aws-config"
          export AWS_SHARED_CREDENTIALS_FILE="$RUNNER_TEMP/no-aws-credentials"
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/terraform-plugins"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          python -m pytest --cov=ingest --cov=orchestration --cov-branch \
            --cov-report=term-missing --cov-report=json:coverage.json \
            --cov-report=lcov:coverage.lcov

      - name: Enforce exact project and changed-line coverage
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python .github/coverage_gate.py --coverage coverage.json --base "$DIFF_BASE"

      - name: Retain coverage reports
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage.json
            coverage.lcov
          if-no-files-found: error
          retention-days: 7

      - name: Remove isolated PostgreSQL
        if: always()
        run: |
          if docker container inspect carrier-risk-test-postgres >/dev/null 2>&1; then
            docker rm --force --volumes carrier-risk-test-postgres
          fi
