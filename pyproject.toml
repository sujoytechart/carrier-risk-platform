[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carrier-risk-platform"
version = "0.1.0"
description = "Point-in-time correct carrier risk data platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
model = [
    "numpy>=2.2,<3",
    "scikit-learn>=1.7,<2",
    "mlflow>=3.3,<4",
]
serving = [
    "carrier-risk-platform[model]",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "prometheus-client>=0.22,<1",
    "psycopg-pool>=3.2,<4",
]
airflow = [
    "apache-airflow[postgres]>=3.3,<3.4",
    "apache-airflow-providers-amazon>=9,<10",
    "aiobotocore>=3,<4",
]
dbt = [
    "dbt-core>=1.10,<2",
    "dbt-postgres>=1.9,<2",
]
snowflake = [
    "dbt-snowflake>=1.12,<2",
]
parquet = [
    "pyarrow>=23.0.1,<24",
]
charts = [
    "matplotlib>=3.11,<4",
]
dev = [
    "carrier-risk-platform[model,serving]",
    "httpx>=0.28,<1",
    "locust>=2.39,<3",
    "dbt-core>=1.10,<2",
    "dbt-postgres>=1.9,<2",
    "dbt-snowflake>=1.12,<2",
    "mypy>=1.13,<2",
    "pyarrow>=23.0.1,<24",
    "psycopg[binary]>=3.2,<4",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
    "types-boto3[s3,sqs,sts]>=1.35,<2",
]

[tool.setuptools.packages.find]
include = ["ingest*", "orchestration*", "ml*", "serving*"]

[tool.setuptools.package-data]
ingest = ["schemas/*.json", "sql/*.sql"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ingest", "orchestration", "ml", "serving"]
