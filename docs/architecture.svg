<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="705" viewBox="0 0 1600 940" role="img" aria-labelledby="title description">
  <title id="title">Carrier risk platform data flow</title>
  <desc id="description">Federal crash and inspection snapshots move through object storage, queue notifications, Airflow orchestration, temporal warehouse models, model governance, and a scored API. Local equivalents are shown beside cloud services.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef5f7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2878a8"/>
    </marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#168675"/>
    </marker>
    <style>
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526a7a; }
      .lane-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #486275; }
      .box-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .box-subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526a7a; }
      .arrow-label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486275; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #627d8f; }
      .pill { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .box { fill: #ffffff; stroke: #c7d8e2; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .cloud { stroke: #2878a8; }
      .data { stroke: #168675; }
      .model { stroke: #8357a5; }
      .flow-blue { fill: none; stroke: #2878a8; stroke-width: 4; marker-end: url(#arrow-blue); }
      .flow-teal { fill: none; stroke: #168675; stroke-width: 4; marker-end: url(#arrow-teal); }
      .branch { fill: none; stroke: #6b8799; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow-blue); }
    </style>
  </defs>
  <rect width="1600" height="940" fill="url(#background)"/>
  <text x="64" y="68" class="title">Point-in-time carrier risk, from source file to scored API</text>
  <text x="64" y="101" class="subtitle">Cloud services and local equivalents share the same contracts, replay behavior, and temporal controls.</text>
  <rect x="48" y="132" width="1504" height="222" rx="22" fill="#eef6fb" stroke="#d5e6f0"/>
  <rect x="48" y="375" width="1504" height="242" rx="22" fill="#edf8f5" stroke="#d0eae3"/>
  <rect x="48" y="638" width="1504" height="246" rx="22" fill="#f6f1fa" stroke="#e1d5ea"/>
  <text x="76" y="169" class="lane-title">INGESTION &amp; ORCHESTRATION</text>
  <text x="76" y="412" class="lane-title">VERSIONED HISTORY &amp; ANALYTICS</text>
  <text x="76" y="675" class="lane-title">MODEL GOVERNANCE &amp; SERVING</text>

  <g transform="translate(78 200)">
    <rect class="box cloud" width="225" height="104"/>
    <rect x="18" y="18" width="54" height="27" rx="13.5" fill="#2878a8"/>
    <text x="45" y="37" text-anchor="middle" class="pill">01</text>
    <text x="88" y="40" class="box-title">FMCSA</text>
    <text x="20" y="72" class="box-subtitle">Crash + inspection files</text>
    <text x="20" y="94" class="small">Immutable source snapshots</text>
  </g>
  <path d="M303 252 H360" class="flow-blue"/>
  <text x="332" y="236" text-anchor="middle" class="arrow-label">download</text>
  <g transform="translate(368 200)">
    <rect class="box cloud" width="248" height="104"/>
    <rect x="18" y="18" width="54" height="27" rx="13.5" fill="#2878a8"/>
    <text x="45" y="37" text-anchor="middle" class="pill">02</text>
    <text x="88" y="40" class="box-title">S3</text>
    <text x="20" y="72" class="box-subtitle">Objects + manifests</text>
    <text x="20" y="94" class="small">Local: MinIO</text>
  </g>
  <path d="M616 252 H673" class="flow-blue"/>
  <text x="645" y="236" text-anchor="middle" class="arrow-label">notify</text>
  <g transform="translate(681 200)">
    <rect class="box cloud" width="248" height="104"/>
    <rect x="18" y="18" width="54" height="27" rx="13.5" fill="#2878a8"/>
    <text x="45" y="37" text-anchor="middle" class="pill">03</text>
    <text x="88" y="40" class="box-title">SQS</text>
    <text x="20" y="72" class="box-subtitle">Arrival messages</text>
    <text x="20" y="94" class="small">Local: ElasticMQ</text>
  </g>
  <path d="M929 252 H986" class="flow-blue"/>
  <text x="958" y="236" text-anchor="middle" class="arrow-label">trigger</text>
  <g transform="translate(994 200)">
    <rect class="box cloud" width="250" height="104"/>
    <rect x="18" y="18" width="54" height="27" rx="13.5" fill="#2878a8"/>
    <text x="45" y="37" text-anchor="middle" class="pill">04</text>
    <text x="88" y="40" class="box-title">Airflow</text>
    <text x="20" y="72" class="box-subtitle">Validate, load, backfill</text>
    <text x="20" y="94" class="small">Retries without duplicate rows</text>
  </g>
  <path d="M1244 252 H1301" class="flow-blue"/>
  <text x="1273" y="236" text-anchor="middle" class="arrow-label">observe</text>
  <g transform="translate(1309 200)">
    <rect class="box cloud" width="214" height="104"/>
    <text x="20" y="40" class="box-title">Logs + metrics</text>
    <text x="20" y="72" class="box-subtitle">Task attempts</text>
    <text x="20" y="94" class="small">Failure + recovery proof</text>
  </g>

  <path d="M1119 304 V426" class="flow-teal"/>
  <text x="1132" y="369" class="arrow-label">transactional load</text>
  <g transform="translate(800 439)">
    <rect class="box data" width="292" height="126"/>
    <rect x="18" y="18" width="54" height="27" rx="13.5" fill="#168675"/>
    <text x="45" y="37" text-anchor="middle" class="pill">05</text>
    <text x="88" y="40" class="box-title">PostgreSQL</text>
    <text x="20" y="74" class="box-subtitle">Raw batches + durable history</text>
    <text x="20" y="98" class="small">Checksums, lineage, idempotency</text>
  </g>
  <path d="M800 502 H735" class="flow-teal"/>
  <text x="768" y="486" text-anchor="middle" class="arrow-label">build</text>
  <g transform="translate(420 439)">
    <rect class="box data" width="307" height="126"/>
    <rect x="18" y="18" width="54" height="27" rx="13.5" fill="#168675"/>
    <text x="45" y="37" text-anchor="middle" class="pill">06</text>
    <text x="88" y="40" class="box-title">dbt</text>
    <text x="20" y="74" class="box-subtitle">Knowledge-valid event versions</text>
    <text x="20" y="98" class="small">Four blocking temporal guards</text>
  </g>
  <path d="M420 502 H355" class="flow-teal"/>
  <text x="388" y="486" text-anchor="middle" class="arrow-label">publish</text>
  <g transform="translate(78 439)">
    <rect class="box data" width="269" height="126"/>
    <text x="20" y="40" class="box-title">Historical features</text>
    <text x="20" y="74" class="box-subtitle">Correct as of scoring date</text>
    <text x="20" y="98" class="small">No future reports or corrections</text>
  </g>
  <path d="M492 304 V387 H1230 V426" class="branch"/>
  <text x="855" y="378" text-anchor="middle" class="arrow-label">validated snapshot derivatives</text>
  <g transform="translate(1160 439)">
    <rect class="box cloud" width="363" height="126"/>
    <text x="20" y="40" class="box-title">Analytics paths</text>
    <text x="20" y="72" class="box-subtitle">Parquet + Athena · reconciliation</text>
    <text x="20" y="98" class="box-subtitle">Snowflake · trial parity proof</text>
  </g>
  <path d="M574 565 V596 H1342 V578" class="branch"/>
  <text x="963" y="592" text-anchor="middle" class="arrow-label">portable SQL contracts</text>

  <path d="M212 565 V699" class="flow-teal"/>
  <g transform="translate(78 713)">
    <rect class="box model" width="269" height="116"/>
    <rect x="18" y="18" width="54" height="27" rx="13.5" fill="#8357a5"/>
    <text x="45" y="37" text-anchor="middle" class="pill">07</text>
    <text x="88" y="40" class="box-title">Maturity gate</text>
    <text x="20" y="74" class="box-subtitle">495-day measured grace</text>
    <text x="20" y="98" class="small">Real-data training stays blocked</text>
  </g>
  <path d="M347 771 H410" class="flow-blue"/>
  <text x="379" y="755" text-anchor="middle" class="arrow-label">eligible only</text>
  <g transform="translate(418 713)">
    <rect class="box model" width="269" height="116"/>
    <rect x="18" y="18" width="54" height="27" rx="13.5" fill="#8357a5"/>
    <text x="45" y="37" text-anchor="middle" class="pill">08</text>
    <text x="88" y="40" class="box-title">MLflow</text>
    <text x="20" y="74" class="box-subtitle">Runs + model registry</text>
    <text x="20" y="98" class="small">Synthetic fixture is explicit</text>
  </g>
  <path d="M687 771 H750" class="flow-blue"/>
  <text x="719" y="755" text-anchor="middle" class="arrow-label">champion</text>
  <g transform="translate(758 713)">
    <rect class="box model" width="269" height="116"/>
    <rect x="18" y="18" width="54" height="27" rx="13.5" fill="#8357a5"/>
    <text x="45" y="37" text-anchor="middle" class="pill">09</text>
    <text x="88" y="40" class="box-title">FastAPI</text>
    <text x="20" y="74" class="box-subtitle">Point-in-time score endpoint</text>
    <text x="20" y="98" class="small">Readiness + Prometheus metrics</text>
  </g>
  <path d="M1027 771 H1090" class="flow-blue"/>
  <text x="1059" y="755" text-anchor="middle" class="arrow-label">exercise</text>
  <g transform="translate(1098 713)">
    <rect class="box model" width="269" height="116"/>
    <rect x="18" y="18" width="54" height="27" rx="13.5" fill="#8357a5"/>
    <text x="45" y="37" text-anchor="middle" class="pill">10</text>
    <text x="88" y="40" class="box-title">Locust</text>
    <text x="20" y="74" class="box-subtitle">Open-arrival load test</text>
    <text x="20" y="98" class="small">p99 14 ms at 200 rps</text>
  </g>
  <g transform="translate(1391 713)">
    <rect width="132" height="116" rx="16" fill="#102a43"/>
    <text x="66" y="41" text-anchor="middle" class="pill">AUDITABLE</text>
    <text x="66" y="67" text-anchor="middle" class="pill">REPLAYABLE</text>
    <text x="66" y="93" text-anchor="middle" class="pill">TIME-AWARE</text>
  </g>
  <text x="80" y="907" class="small">Solid arrows carry the primary data path. Dashed arrows show analytics and adapter-portability branches.</text>
  <text x="1520" y="907" text-anchor="end" class="small">Recorded evidence: September 2026</text>
</svg>
